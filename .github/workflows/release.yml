name: Derle ve yayınla

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Windows makinelerinin konsolu cp1252; Python çıktısı Türkçe harflerde hata vermesin
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Sürüm numarası
        id: surum
        shell: pwsh
        run: |
          $ver = python -c "import altyazitr; print(altyazitr.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$ver") {
            Write-Error "Etiket ${{ github.ref_name }} ile uygulama sürümü v$ver uyuşmuyor (altyazitr/__init__.py)."
            exit 1
          }
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Uygulamayı derle (PyInstaller)
        run: python -m PyInstaller RobzVision.spec --noconfirm --clean

      - name: Taşınabilir sürümler (zip ve 7z)
        shell: pwsh
        run: |
          $v = "${{ steps.surum.outputs.ver }}"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/RobzVision/
          New-Item -ItemType Directory -Force cikti | Out-Null
          7z a -tzip -mx=7 "cikti/RobzVision-Tasinabilir-$v-x64.zip" ./dist/RobzVision | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z a -t7z -mx=9 "cikti/RobzVision-Tasinabilir-$v-x64.7z" ./dist/RobzVision | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Kurulum sihirbazı (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.surum.outputs.ver }}" "/O$PWD\cikti" installer\RobzVision.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256 özetleri ve sürüm notları
        shell: pwsh
        run: |
          $satirlar = Get-ChildItem cikti -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF satır sonu: Linux/macOS'taki `sha256sum -c` de okuyabilsin (Set-Content CRLF yazar)
          [IO.File]::WriteAllText("$PWD/cikti/SHA256SUMS.txt", ($satirlar -join "`n") + "`n")
          Get-Content cikti/SHA256SUMS.txt
          python tools/surum_notlari.py "${{ steps.surum.outputs.ver }}" surum_notlari.md

      - uses: actions/upload-artifact@v4
        with:
          name: RobzVision-${{ steps.surum.outputs.ver }}
          path: cikti/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Robz Vision ${{ steps.surum.outputs.ver }}
          body_path: surum_notlari.md
          files: cikti/*
          make_latest: true
