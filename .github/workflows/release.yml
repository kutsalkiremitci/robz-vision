name: Derle ve yayınla

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller RobzVision.spec --noconfirm --clean
      - run: |
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md dist/RobzVision/
          Compress-Archive -Path dist/RobzVision -DestinationPath "RobzVision-${{ github.ref_name }}-win64.zip"
        shell: pwsh
      - name: Kurulum sihirbazı (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "import altyazitr; print(altyazitr.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$ver" installer\RobzVision.iss
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: RobzVision-win64
          path: |
            RobzVision-*-win64.zip
            dist/RobzVision-Kurulum-*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            RobzVision-*-win64.zip
            dist/RobzVision-Kurulum-*.exe
          generate_release_notes: true
